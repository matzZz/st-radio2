<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>mare-radio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="mare-radio">
<script>
  // Theme vor dem ersten Zeichnen setzen, sonst blitzt kurz der dunkle Modus auf.
  // Gespeicherte Wahl hat Vorrang, sonst gilt die Systemeinstellung.
  (() => {
    let theme = null;
    try { theme = localStorage.getItem('st-radio-theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface-2: #1c232b;
    --border:    #21262d;
    --text:      #e6e9ef;
    --muted:     #7d8590;
    --accent:    #f0b429;
    --accent-2:  #f7c948;
    --accent-dim: rgba(240, 180, 41, .14);
    --danger:    #da3633;
    --border-hover: #30363d;
    --accent-ink: #f7c948;   /* Akzentfarbe für Text */
    --danger-ink: #ff7b78;   /* Rot für Text */
    --on-accent:  #0d1117;   /* Text auf Akzent-Fläche */
    --shadow:     rgba(0, 0, 0, .4);
    --radius:    14px;
    --font-display: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:        #f4f5f7;
    --surface:   #ffffff;
    --surface-2: #eef0f3;
    --border:    #d8dde3;
    --border-hover: #bcc3cc;
    --text:      #1c2128;
    --muted:     #5f6873;
    --accent:    #e0a00f;
    --accent-2:  #f0b429;
    --accent-dim: rgba(224, 160, 15, .14);
    --accent-ink: #8a5a00;
    --danger-ink: #c62a27;
    --on-accent:  #1c2128;
    --shadow:     rgba(16, 24, 40, .14);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    padding: clamp(16px, 4vw, 40px);
  }

  .shell {
    max-width: 880px;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .brand {
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text);
  }
  .brand span { color: var(--accent); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .lang-switch {
    display: flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .lang-switch button {
    padding: 3px 9px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: .12em;
  }
  .lang-switch button[aria-pressed="true"] {
    background: var(--surface-2);
    color: var(--accent-ink);
  }
  .theme-btn {
    width: 28px; height: 28px;
    padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
  }
  .theme-btn:hover:not(:disabled) { color: var(--accent-ink); }
  .theme-btn svg { width: 14px; height: 14px; }
  /* zeigt immer den Modus, zu dem man wechselt */
  :root[data-theme="light"] .theme-btn .i-sun,
  :root:not([data-theme="light"]) .theme-btn .i-moon { display: none; }
  .meta {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---------- Now Playing Display ---------- */
  .display {
    background:
      radial-gradient(120% 80% at 50% 0%, var(--accent-dim) 0%, transparent 55%),
      var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .display::before {
    /* dezente Frequenz-Skala oben */
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0,
      var(--accent) 20%, var(--accent) 80%,
      transparent 100%);
    opacity: .35;
  }

  .label {
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    transition: background .25s ease;
  }
  .dot.live {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .45; }
  }

  .now {
    font-family: var(--font-display);
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--text);
    word-break: break-word;
    min-height: 1.2em;
  }
  .now.is-idle { color: var(--muted); font-weight: 400; }
  .sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    font-family: var(--font-display);
    letter-spacing: .04em;
  }

  /* Laufender Titel (aus dem Stream bzw. Podcast-Folge mit Cover) */
  .now-track {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    min-width: 0;
  }
  .now-track[hidden] { display: none; }
  .now-track img {
    flex: 0 0 auto;
    width: 48px; height: 48px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .now-track img[hidden] { display: none; }
  .now-track span {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--accent-ink);
    overflow-wrap: anywhere;
  }

  /* EQ-Bars als Now-Playing-Signature */
  .eq {
    margin-top: 18px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 28px;
  }
  .eq span {
    display: block;
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
    opacity: .9;
    height: 6px;
    transform-origin: bottom;
  }
  .is-playing .eq span {
    animation: bar 1.2s ease-in-out infinite;
  }
  .eq span:nth-child(1) { animation-delay: -.0s; }
  .eq span:nth-child(2) { animation-delay: -.2s; }
  .eq span:nth-child(3) { animation-delay: -.4s; }
  .eq span:nth-child(4) { animation-delay: -.1s; }
  .eq span:nth-child(5) { animation-delay: -.5s; }
  .eq span:nth-child(6) { animation-delay: -.3s; }
  .eq span:nth-child(7) { animation-delay: -.6s; }
  @keyframes bar {
    0%, 100% { height: 6px; }
    50%      { height: 28px; }
  }

  /* Controls im Display */
  .controls {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: .04em;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .05s ease;
  }
  button:hover:not(:disabled) {
    background: var(--surface);
    border-color: var(--border-hover);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .btn-stop {
    border-color: rgba(218, 54, 51, .35);
    color: var(--danger-ink);
  }
  .btn-stop:hover:not(:disabled) {
    background: rgba(218, 54, 51, .12);
    border-color: rgba(218, 54, 51, .55);
  }

  /* ---------- Senderliste ---------- */
  .section-title {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }

  .station {
    text-align: left;
    border-radius: var(--radius);
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    color: var(--text);
  }
  .station:hover:not(:disabled) {
    background: var(--surface-2);
    border-color: var(--border-hover);
  }

  .station .index {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
    min-width: 22px;
  }
  .station .body { flex: 1; min-width: 0; }
  /* Block statt inline, sonst greift das Abschneiden mit … bei langen Namen nicht */
  .station .name,
  .station .genre { display: block; }
  .station .name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .station .genre {
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .station.is-active {
    background: var(--accent-dim);
    border-color: rgba(240, 180, 41, .45);
  }
  .station.is-active .index,
  .station.is-active .genre { color: var(--accent-ink); }
  .station.is-active .name  { color: var(--text); }

  /* Webhook-Link-Knopf in jeder Card */
  .link-btn {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .link-btn:hover {
    color: var(--accent-ink);
    background: rgba(240, 180, 41, .08);
    border-color: rgba(240, 180, 41, .25);
  }
  .link-btn svg { width: 14px; height: 14px; }

  /* ---------- Podcasts ---------- */
  .pod-section { margin-top: 28px; }
  /* breitere Karten – Podcasts haben bis zu drei Symbole */
  #podcasts { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .pod-section[hidden],
  .editing .pod-section { display: none; }
  .station .resume-at { color: var(--accent-ink); }

  /* Mini-EQ rechts in der aktiven Card */
  .mini-eq {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .station.is-active .mini-eq { display: flex; }
  .mini-eq span {
    width: 2px; background: var(--accent); border-radius: 1px;
    animation: bar 1.2s ease-in-out infinite;
  }
  .mini-eq span:nth-child(1) { animation-delay: -.1s; }
  .mini-eq span:nth-child(2) { animation-delay: -.4s; }
  .mini-eq span:nth-child(3) { animation-delay: -.2s; }

  /* ---------- Sender-Editor ---------- */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 14px 4px;
  }
  .section-head .section-title { margin: 0; }
  .btn-small { padding: 6px 12px; font-size: 12px; }

  .editor { display: none; }
  .editing .grid { display: none; }
  .editing .editor { display: block; }

  .editor-note {
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 4px 12px;
  }
  .editor-note code { font-family: var(--font-display); color: var(--text); }

  .edit-row {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) minmax(0, 2fr) minmax(0, .7fr) auto;
    gap: 8px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .edit-row .index {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .edit-row input {
    font: inherit;
    font-size: 13px;
    width: 100%;
    min-width: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .edit-row input::placeholder { color: var(--muted); }
  .edit-row .f-slug {
    grid-column: 2 / -1;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .edit-row .f-slug code { color: var(--text); }
  .edit-row input:focus {
    outline: none;
    border-color: rgba(240, 180, 41, .55);
  }
  /* feste Position oben rechts – sonst rutscht sie hinter die Kennungs-Zeile */
  .row-actions { display: flex; gap: 4px; grid-column: 5; grid-row: 1; }
  .icon-btn {
    width: 32px; height: 32px;
    padding: 0;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn.danger:hover:not(:disabled) {
    color: var(--danger-ink);
    border-color: rgba(218, 54, 51, .55);
    background: rgba(218, 54, 51, .12);
  }

  .editor-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-2);
    border-color: var(--accent-2);
  }

  @media (max-width: 640px) {
    .edit-row { grid-template-columns: 28px minmax(0, 1fr) auto; }
    .edit-row .index       { grid-column: 1; grid-row: 1; }
    .edit-row .f-name      { grid-column: 2; grid-row: 1; }
    .edit-row .row-actions { grid-column: 3; grid-row: 1; }
    .edit-row .f-url,
    .edit-row .f-genre     { grid-column: 2 / 4; }
  }

  /* ---------- Toast / Fehler ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    box-shadow: 0 10px 30px var(--shadow);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.is-error { border-color: rgba(218,54,51,.45); color: var(--danger-ink); }

  footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dashed transparent; }
  footer a:hover { color: var(--text); border-bottom-color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .dot.live,
    .eq span,
    .mini-eq span { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">mare<span>·</span>radio</div>
      <div class="header-right">
        <button class="theme-btn" id="btn-theme">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <div class="lang-switch" role="group" data-i18n-aria="language">
          <button data-lang="de" aria-pressed="false">DE</button>
          <button data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="meta" id="clock">--:--</div>
      </div>
    </header>

    <section class="display" id="display" aria-live="polite">
      <div class="label">
        <span class="dot" id="dot"></span>
        <span id="state-label" data-i18n="ready">Bereit</span>
      </div>
      <div class="now is-idle" id="now" data-i18n="noStation">— kein Sender —</div>
      <div class="sub" id="sub" data-i18n="pick">Wähle einen Sender unten</div>
      <div class="now-track" id="track" hidden>
        <img id="track-cover" alt="" hidden>
        <span id="track-title"></span>
      </div>

      <div class="eq" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="controls">
        <button class="btn-stop" id="btn-stop" disabled data-i18n="stop">Ausschalten</button>
      </div>
    </section>

    <section id="list-wrap">
      <div class="section-head">
        <h2 class="section-title" id="list-title" data-i18n="radio">Radio</h2>
        <button class="btn-small" id="btn-edit" data-i18n="edit">Bearbeiten</button>
      </div>

      <div class="grid" id="stations">
        <!-- befüllt per JS -->
      </div>

      <div class="pod-section" id="pod-section" hidden>
        <h2 class="section-title" data-i18n="podcasts">Podcasts</h2>
        <div class="grid" id="podcasts"></div>
      </div>

      <div class="editor" id="editor">
        <p class="editor-note" data-i18n-html="editorNote"></p>
        <div id="edit-rows"></div>
        <div class="editor-actions">
          <button id="btn-add" data-i18n="add">+ Sender hinzufügen</button>
          <button class="btn-primary" id="btn-save" data-i18n="save">Speichern</button>
          <button id="btn-cancel" data-i18n="cancel">Abbrechen</button>
        </div>
      </div>
    </section>

    <footer>
      <span><a href="https://github.com/matzZz/st-radio2" target="_blank" rel="noopener">matzZz / mare-radio</a></span>
      <span id="conn">verbunden</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = sel => document.querySelector(sel);
  const display = $('#display');
  const dot     = $('#dot');
  const stateLb = $('#state-label');
  const now     = $('#now');
  const sub     = $('#sub');
  const btnStop = $('#btn-stop');
  const grid    = $('#stations');
  const podGrid = $('#podcasts');
  const podSection = $('#pod-section');
  const listTitle  = $('#list-title');
  const toast   = $('#toast');
  const clock   = $('#clock');
  const conn    = $('#conn');
  const trackEl = $('#track');
  const trackTitle = $('#track-title');
  const trackCover = $('#track-cover');

  let stations  = [];
  let currentId = null;
  let currentStation = null;
  let currentTrack = null;
  let online    = true;

  // ---------- Sprache (DE/EN) ----------
  const I18N = {
    de: {
      language: 'Sprache', themeLight: 'Heller Modus', themeDark: 'Dunkler Modus',
      ready: 'Bereit', live: 'Live',
      noStation: '— kein Sender —', pick: 'Wähle einen Sender unten',
      stop: 'Ausschalten', stations: 'Sender', radio: 'Radio', podcasts: 'Podcasts', edit: 'Bearbeiten',
      editorNote: 'Jeder Sender hat eine feste Kennung (z.&nbsp;B. <code>slug=detektorfmmusik</code>). ' +
                  'Sie bleibt beim Umbenennen und Verschieben gleich – gespeicherte Links funktionieren ' +
                  'also weiter. Nur wer einen Sender löscht, macht seinen Link ungültig. ' +
                  'Für einen Podcast einfach die RSS-Feed-Adresse eintragen – das wird beim Speichern erkannt.',
      resumeAt: '{t} gehört', resume: 'Fortsetzen', restart: 'Von vorn', podcast: 'Podcast',
      add: '+ Sender hinzufügen', save: 'Speichern', cancel: 'Abbrechen',
      connected: 'verbunden', offline: 'offline',
      copyLink: 'Webhook-URL kopieren', copyLinkFor: 'Webhook-URL für {name} kopieren',
      copied: 'Webhook-URL kopiert: {slug}',
      playing: 'Spielt: {name}', stopped: 'Gestoppt.',
      loadFailed: 'Senderliste konnte nicht geladen werden', saved: 'Senderliste gespeichert.',
      name: 'Name', url: 'Stream-URL', urlPlaceholder: 'https://… (Stream- oder Podcast-Feed-URL)', genre: 'Genre',
      up: 'Nach oben', down: 'Nach unten', del: 'Löschen',
      slug: 'Kennung:', slugNew: 'Kennung wird beim Speichern aus dem Namen vergeben',
      confirmDel: '„{name}“ löschen?', stationN: 'Sender {n}',
    },
    en: {
      language: 'Language', themeLight: 'Light mode', themeDark: 'Dark mode',
      ready: 'Ready', live: 'Live',
      noStation: '— no station —', pick: 'Pick a station below',
      stop: 'Turn off', stations: 'Stations', radio: 'Radio', podcasts: 'Podcasts', edit: 'Edit',
      editorNote: 'Every station has a fixed ID (e.g. <code>slug=detektorfmmusik</code>). ' +
                  'It stays the same when you rename or move a station, so saved links keep ' +
                  'working. Only deleting a station breaks its link. ' +
                  'For a podcast, just enter its RSS feed URL – it is detected when saving.',
      resumeAt: '{t} played', resume: 'Resume', restart: 'From the start', podcast: 'Podcast',
      add: '+ Add station', save: 'Save', cancel: 'Cancel',
      connected: 'connected', offline: 'offline',
      copyLink: 'Copy webhook URL', copyLinkFor: 'Copy webhook URL for {name}',
      copied: 'Webhook URL copied: {slug}',
      playing: 'Playing: {name}', stopped: 'Stopped.',
      loadFailed: 'Could not load station list', saved: 'Station list saved.',
      name: 'Name', url: 'Stream URL', urlPlaceholder: 'https://… (stream or podcast feed URL)', genre: 'Genre',
      up: 'Move up', down: 'Move down', del: 'Delete',
      slug: 'ID:', slugNew: 'ID will be generated from the name when saving',
      confirmDel: 'Delete “{name}”?', stationN: 'Station {n}',
    },
  };

  function loadLang() {
    // ?lang=en in der Adresse hat Vorrang (z.B. für geteilte Links)
    const fromUrl = new URLSearchParams(location.search).get('lang');
    if (fromUrl in I18N) return fromUrl;
    try {
      const saved = localStorage.getItem('st-radio-lang');
      if (saved in I18N) return saved;
    } catch (e) {}
    return (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'de';
  }
  let lang = loadLang();

  /** Übersetzt einen Text, z.B. t('playing', { name: 'SWR1' }). */
  function t(key, vars = {}) {
    let msg = I18N[lang][key] ?? I18N.de[key] ?? key;
    for (const [k, v] of Object.entries(vars)) msg = msg.split('{' + k + '}').join(v);
    return msg;
  }

  /** Text-Escaping für Werte, die per innerHTML in Attribute wandern. */
  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    applyTheme(currentTheme());
    renderStations();
    setPlaying(currentStation, currentTrack);
    setOnline(online);
    if (listWrap.classList.contains('editing')) renderEditor();
  }

  // ---------- Hell/Dunkel ----------
  const btnTheme = $('#btn-theme');

  function currentTheme() {
    return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f5f7' : '#0d1117';
    const label = t(theme === 'light' ? 'themeDark' : 'themeLight');
    btnTheme.title = label;
    btnTheme.setAttribute('aria-label', label);
  }

  function toggleTheme() {
    const next = currentTheme() === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('st-radio-theme', next); } catch (e) {}
    applyTheme(next);
  }

  function setLang(next) {
    lang = next;
    try { localStorage.setItem('st-radio-lang', next); } catch (e) {}
    applyLang();
  }

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.classList.toggle('is-error', isError);
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  async function api(action, opts = {}) {
    const url = `api.php?action=${encodeURIComponent(action)}&lang=${lang}` +
                (opts.id != null ? `&id=${encodeURIComponent(opts.id)}` : '') +
                (opts.from ? `&from=${encodeURIComponent(opts.from)}` : '');
    const res = await fetch(url, { method: opts.method || 'GET' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  }

  /** Sekunden als 12:34 bzw. 1:02:03. */
  function formatTime(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }

  const ICON_RESUME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"></path></svg>';
  const ICON_RESTART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>';

  function renderStations() {
    grid.innerHTML = '';
    podGrid.innerHTML = '';
    const origin = location.origin + location.pathname.replace(/[^/]*$/, '');
    const count = { radio: 0, podcast: 0 };
    stations.forEach(s => {
      const isPod = s.type === 'podcast';
      const nr = ++count[isPod ? 'podcast' : 'radio'];
      // Podcast mit gemerkter Stelle (und nicht gerade am Laufen): Symbole zum Fortsetzen / von vorn
      const canResume = isPod && s.resume > 0 && s.id !== currentId;
      const card = document.createElement('div');
      card.className = 'station';
      card.dataset.id = s.id;
      if (s.id === currentId) card.classList.add('is-active');

      card.innerHTML = `
        <button class="play-area" aria-pressed="${s.id === currentId}" style="
          all: unset; cursor: pointer; flex: 1; display: flex; align-items: center;
          gap: 12px; min-width: 0; color: inherit;
        ">
          <span class="index">${String(nr).padStart(2, '0')}</span>
          <span class="body">
            <span class="name"></span>
            <span class="genre"></span>
          </span>
        </button>
        <span class="mini-eq" aria-hidden="true"><span></span><span></span><span></span></span>
        ${canResume ? `
        <button class="link-btn" data-act="resume" title="${esc(t('resume'))}" aria-label="${esc(t('resume'))}">${ICON_RESUME}</button>
        <button class="link-btn" data-act="restart" title="${esc(t('restart'))}" aria-label="${esc(t('restart'))}">${ICON_RESTART}</button>` : ''}
        <button class="link-btn" data-act="link" title="${esc(t('copyLink'))}" aria-label="${esc(t('copyLinkFor', { name: s.name }))}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </button>
      `;
      card.querySelector('.name').textContent  = s.name;
      const genre = card.querySelector('.genre');
      if (canResume) {
        genre.textContent = t('resumeAt', { t: formatTime(s.resume) });
        genre.classList.add('resume-at');
      } else {
        genre.textContent = s.genre || (isPod ? t('podcast') : 'Radio');
      }
      // Klick auf die Karte: Radio starten bzw. Podcast fortsetzen
      card.querySelector('.play-area').addEventListener('click', () => play(s.id));
      if (canResume) {
        card.querySelector('[data-act=resume]').addEventListener('click', () => play(s.id));
        card.querySelector('[data-act=restart]').addEventListener('click', () => play(s.id, 'start'));
      }
      card.querySelector('[data-act=link]').addEventListener('click', (ev) => {
        ev.stopPropagation();
        const url = origin + 'api.php?action=play&slug=' + encodeURIComponent(s.slug);
        copyToClipboard(url);
        showToast(t('copied', { slug: s.slug }));
      });
      (isPod ? podGrid : grid).appendChild(card);
    });
    podSection.hidden = count.podcast === 0;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /** Zeigt den laufenden Titel bzw. die Podcast-Folge (oder blendet die Zeile aus). */
  function setTrack(track) {
    currentTrack = track || null;
    trackEl.hidden = !currentTrack;
    if (!currentTrack) return;
    trackTitle.textContent = currentTrack.title;
    if (currentTrack.cover) {
      if (trackCover.getAttribute('src') !== currentTrack.cover) trackCover.src = currentTrack.cover;
      trackCover.hidden = false;
    } else {
      trackCover.removeAttribute('src');
      trackCover.hidden = true;
    }
  }

  function setPlaying(station, track = null) {
    const prev = currentStation;
    currentStation = station;
    currentId = station ? station.id : null;
    if ((prev ? prev.id : null) !== currentId) {
      // Podcast beendet/gewechselt → gemerkte Stelle neu laden; sonst nur Karten neu zeichnen
      if (prev && prev.type === 'podcast') loadStations();
      else renderStations();
    }
    setTrack(station ? track : null);

    if (station) {
      display.classList.add('is-playing');
      dot.classList.add('live');
      stateLb.textContent = t('live');
      now.textContent = station.name;
      now.classList.remove('is-idle');
      sub.textContent = station.genre ? station.genre.toUpperCase()
                      : (station.type === 'podcast' ? t('podcast').toUpperCase() : 'STREAM');
      btnStop.disabled = false;
    } else {
      display.classList.remove('is-playing');
      dot.classList.remove('live');
      stateLb.textContent = t('ready');
      now.textContent = t('noStation');
      now.classList.add('is-idle');
      sub.textContent = t('pick');
      btnStop.disabled = true;
    }

    // Cards aktualisieren
    document.querySelectorAll('.grid .station').forEach(el => {
      const active = Number(el.dataset.id) === currentId;
      el.classList.toggle('is-active', active);
      const playBtn = el.querySelector('.play-area');
      if (playBtn) playBtn.setAttribute('aria-pressed', String(active));
    });
  }

  async function play(id, from) {
    try {
      const data = await api('play', { method: 'POST', id, from });
      setPlaying(data.station, data.track);
      showToast(t('playing', { name: data.station.name }));
      // mpv braucht einen Moment, bis die ersten Stream-Infos da sind
      setTimeout(refreshStatus, 2500);
    } catch (e) {
      showToast(e.message, true);
    }
  }

  async function stop() {
    try {
      await api('stop', { method: 'POST' });
      setPlaying(null);
      showToast(t('stopped'));
    } catch (e) {
      showToast(e.message, true);
    }
  }

  async function loadStations() {
    try {
      const data = await api('stations');
      stations = data.stations || [];
      renderStations();
    } catch (e) {
      showToast(t('loadFailed'), true);
    }
  }

  async function refreshStatus() {
    try {
      const data = await api('status');
      setOnline(true);
      setPlaying(data.playing ? data.station : null, data.track);
    } catch (e) {
      setOnline(false);
    }
  }

  function setOnline(state) {
    online = state;
    conn.textContent = t(state ? 'connected' : 'offline');
  }

  function tickClock() {
    const d = new Date();
    clock.textContent =
      String(d.getHours()).padStart(2, '0') + ':' +
      String(d.getMinutes()).padStart(2, '0');
  }

  // ---------- Sender-Editor ----------
  const listWrap  = $('#list-wrap');
  const rowsEl    = $('#edit-rows');
  const btnEdit   = $('#btn-edit');
  const btnAdd    = $('#btn-add');
  const btnSave   = $('#btn-save');
  const btnCancel = $('#btn-cancel');

  let draft = [];

  function openEditor() {
    draft = stations.map(s => ({ name: s.name, url: s.url, genre: s.genre, slug: s.slug, type: s.type }));
    if (draft.length === 0) draft.push({ name: '', url: '', genre: '', slug: '' });
    renderEditor();
    listWrap.classList.add('editing');
    btnEdit.hidden = true;
    listTitle.dataset.i18n = 'stations';
    listTitle.textContent = t('stations');
  }

  function closeEditor() {
    listWrap.classList.remove('editing');
    btnEdit.hidden = false;
    listTitle.dataset.i18n = 'radio';
    listTitle.textContent = t('radio');
  }

  function renderEditor() {
    rowsEl.innerHTML = '';
    draft.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'edit-row';
      row.innerHTML = `
        <span class="index">${String(i + 1).padStart(2, '0')}</span>
        <input class="f-name" placeholder="${esc(t('name'))}" aria-label="${esc(t('name'))}" maxlength="60">
        <input class="f-url" placeholder="${esc(t('urlPlaceholder'))}" aria-label="${esc(t('url'))}"
               inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
        <input class="f-genre" placeholder="${esc(t('genre'))}" aria-label="${esc(t('genre'))}" maxlength="30">
        <span class="f-slug"></span>
        <span class="row-actions">
          <button class="icon-btn" data-act="up" title="${esc(t('up'))}" aria-label="${esc(t('up'))}">↑</button>
          <button class="icon-btn" data-act="down" title="${esc(t('down'))}" aria-label="${esc(t('down'))}">↓</button>
          <button class="icon-btn danger" data-act="del" title="${esc(t('del'))}" aria-label="${esc(t('del'))}">✕</button>
        </span>
      `;
      for (const field of ['name', 'url', 'genre']) {
        const input = row.querySelector('.f-' + field);
        input.value = s[field] || '';
        input.addEventListener('input', () => { s[field] = input.value; });
      }
      const slugEl = row.querySelector('.f-slug');
      if (s.slug) {
        slugEl.innerHTML = esc(t('slug')) + ' <code></code>';
        slugEl.querySelector('code').textContent = s.slug;
        if (s.type === 'podcast') slugEl.append(' · ' + t('podcast'));
      } else {
        slugEl.textContent = t('slugNew');
      }
      row.querySelector('[data-act=up]').disabled   = i === 0;
      row.querySelector('[data-act=down]').disabled = i === draft.length - 1;
      row.querySelector('.row-actions').addEventListener('click', ev => {
        const btn = ev.target.closest('button');
        if (!btn) return;
        if (btn.dataset.act === 'del') {
          if (!confirm(t('confirmDel', { name: s.name || t('stationN', { n: i + 1 }) }))) return;
          draft.splice(i, 1);
        } else {
          const j = btn.dataset.act === 'up' ? i - 1 : i + 1;
          [draft[i], draft[j]] = [draft[j], draft[i]];
        }
        renderEditor();
      });
      rowsEl.appendChild(row);
    });
  }

  function addRow() {
    draft.push({ name: '', url: '', genre: '', slug: '' });
    renderEditor();
    rowsEl.lastElementChild.querySelector('.f-name').focus();
  }

  async function saveStations() {
    btnSave.disabled = true;
    try {
      const res = await fetch(`api.php?action=save&lang=${lang}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stations: draft }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      stations = data.stations || [];
      renderStations();
      closeEditor();
      showToast(t('saved'));
      refreshStatus();
    } catch (e) {
      showToast(e.message, true);
    } finally {
      btnSave.disabled = false;
    }
  }

  btnEdit.addEventListener('click', openEditor);
  btnAdd.addEventListener('click', addRow);
  btnSave.addEventListener('click', saveStations);
  btnCancel.addEventListener('click', closeEditor);

  btnTheme.addEventListener('click', toggleTheme);
  // Cover nicht ladbar → lieber gar kein Bild als ein kaputtes
  trackCover.addEventListener('error', () => { trackCover.hidden = true; });

  btnStop.addEventListener('click', stop);
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });

  // Init
  applyLang();
  tickClock();
  setInterval(tickClock, 30 * 1000);
  loadStations().then(refreshStatus);
  setInterval(refreshStatus, 5000);
})();
</script>
</body>
</html>
